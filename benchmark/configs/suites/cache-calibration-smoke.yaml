schema_version: 1
suite_id: cache-calibration-smoke
description: >
  Local cache calibration smoke suite. This suite generates calibration
  artifacts required by profile-based cache modes; its timing rows are not
  comparable with normal inference timings.
mode: smoke
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i.yaml
ablation_stacks:
  - stack_id: sencache_calibration
    options:
      cache: sencache
      cache_calibrate_ref: flux_sencache_profile
reporting:
  table: cache_calibration_smoke
  generate_public_tables: false
