schema_version: 1
suite_id: task-coverage
description: >
  End-to-end task coverage suite for text-to-image, image editing, and
  text-to-video public-preview DiT workloads.
mode: official
defaults:
  warmup_runs: 1
  measured_runs: 5
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
    - ../systems/diffusers.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i.yaml
    - ../workloads/sd3-medium-t2i.yaml
    - ../workloads/qwen-image-t2i.yaml
    - ../workloads/flux-kontext-edit.yaml
    - ../workloads/qwen-image-edit.yaml
    - ../workloads/wan2-t2v.yaml
reporting:
  table: task_coverage
  require_quality_metrics: false
  notes:
    - Non-text-to-image edge-dit.cpp rows use the CLI single-run boundary.
    - Diffusers non-text-to-image rows may be reported as unsupported until a matching load-once adapter is added.
