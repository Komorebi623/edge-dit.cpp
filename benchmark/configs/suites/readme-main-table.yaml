schema_version: 1
suite_id: readme-main-table
description: >
  README performance main-table suite: public text-to-image models at
  1024x1024, 50 denoising steps, batch 1, single H200 GPU, load-once
  generation timing.
mode: official
defaults:
  warmup_runs: 2
  measured_runs: 10
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
    - ../systems/diffusers.yaml
    - ../systems/stable-diffusion-cpp.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i-1024-s50.yaml
    - ../workloads/sd3-medium-t2i-1024-s50.yaml
    - ../workloads/qwen-image-t2i-1024-s50.yaml
reporting:
  table: readme_main_table
  require_environment_metadata: true
  measurement_boundary: load_once_e2e_generation_no_output_encoding
