schema_version: 1
suite_id: release-v0.1.0-alpha
description: >
  v0.1.0-alpha release benchmark contract. This suite enumerates release-gate
  workloads and systems for the executable benchmark harness.
mode: official
defaults:
  warmup_runs: 2
  measured_runs: 10
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
    - ../systems/diffusers.yaml
    - ../systems/stable-diffusion-cpp.yaml
  parallel:
    - ../systems/edge-dit.yaml
    - ../systems/xdit.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i-1024-s50.yaml
    - ../workloads/sd3-medium-t2i.yaml
    - ../workloads/qwen-image-t2i.yaml
    - ../workloads/flux-kontext-edit.yaml
    - ../workloads/qwen-image-edit.yaml
    - ../workloads/wan2-t2v.yaml
  parallel:
    - ../workloads/flux1-dev-t2i-1024-s50.yaml
parallel_matrix:
  gpu_counts: [1, 2, 4]
  baseline: xdit
  modes:
    edge-dit.cpp: [sequence]
    xdit: [ulysses]
reporting:
  generate_readme_tables: false
  generate_performance_doc_tables: false
  require_quality_metrics: true
  require_environment_metadata: true
