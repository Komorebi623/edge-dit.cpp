schema_version: 1
suite_id: model-smoke
description: >
  Public-model release-gate smoke suite. This suite verifies that each local
  public preview checkpoint can complete one auditable edge-dit.cpp end-to-end
  run before broader performance comparisons are published.
mode: smoke
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i.yaml
    - ../workloads/sd3-medium-t2i.yaml
    - ../workloads/qwen-image-t2i.yaml
    - ../workloads/flux-kontext-edit.yaml
    - ../workloads/qwen-image-edit.yaml
    - ../workloads/wan2-t2v.yaml
reporting:
  table: public_model_smoke
  generate_public_tables: false
