schema_version: 1
suite_id: cfg-smoke
description: >
  Quick FLUX.1-dev CFG-parallel smoke suite for edge-dit.cpp. CFG parallelism
  currently targets a two-GPU split of conditional and unconditional branches.
mode: smoke
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  parallel:
    - ../systems/edge-dit.yaml
workloads:
  parallel:
    - ../workloads/flux1-dev-t2i.yaml
parallel_matrix:
  gpu_counts: [2]
  modes:
    edge-dit.cpp: [cfg]
reporting:
  table: cfg_parallel_smoke
  generate_public_tables: false
