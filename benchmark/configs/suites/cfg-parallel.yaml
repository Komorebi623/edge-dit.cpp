schema_version: 1
suite_id: cfg-parallel
description: >
  Official CFG-parallel scaling suite. SD3 Medium uses true conditional and
  unconditional CFG branches, unlike distilled-guidance FLUX workloads.
mode: official
defaults:
  warmup_runs: 1
  measured_runs: 5
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  parallel:
    - ../systems/edge-dit.yaml
workloads:
  parallel:
    - ../workloads/sd3-medium-t2i-1024-s50.yaml
parallel_matrix:
  gpu_counts: [1, 2]
  modes:
    edge-dit.cpp: [cfg]
reporting:
  table: cfg_parallel_scaling
  require_quality_metrics: false
  headline: SD3 Medium CFG-2 speedup over the single-GPU CFG baseline.
