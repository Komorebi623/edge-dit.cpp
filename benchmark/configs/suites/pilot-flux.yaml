schema_version: 1
suite_id: pilot-flux
description: >
  Minimal FLUX.1-dev pilot used to validate benchmark fairness, measurement
  boundaries, and result formats before official v0.1.0-alpha runs.
mode: pilot
defaults:
  warmup_runs: 1
  measured_runs: 3
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
    - ../systems/diffusers.yaml
    - ../systems/stable-diffusion-cpp.yaml
  parallel:
    - ../systems/edge-dit.yaml
    - ../systems/xdit.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i.yaml
  parallel:
    - ../workloads/flux1-dev-t2i.yaml
parallel_matrix:
  gpu_counts: [1, 2, 4]
  modes:
    edge-dit.cpp: [sequence]
    xdit: [ulysses]
reporting:
  write_raw_results: true
  generate_public_tables: false
