schema_version: 1
suite_id: parallel-smoke
description: >
  Quick FLUX.1-dev sequence-parallel smoke suite for edge-dit.cpp. This verifies
  that the native parallel launcher and result schema work on 1, 2, and 4 GPUs
  before official scaling runs are published.
mode: smoke
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  parallel:
    - ../systems/edge-dit.yaml
workloads:
  parallel:
    - ../workloads/flux1-dev-t2i.yaml
parallel_matrix:
  gpu_counts: [1, 2, 4]
  modes:
    edge-dit.cpp: [sequence]
reporting:
  table: parallel_smoke
  generate_public_tables: false
