schema_version: 1
suite_id: cuda-optimization-ablation
description: >
  End-to-end CUDA graph/operator optimization ablation using separate edge-dit.cpp
  build directories. The system id remains edge-dit.cpp and the build variant is
  recorded in the scenario/run options.
mode: official
defaults:
  warmup_runs: 1
  measured_runs: 5
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i-1024-s50.yaml
scenarios:
  - scenario_id: generic
    options:
      edge_cli_ref: edge_dit_cli_generic
      edge_sample_ref: edge_dit_sample_generic
      cuda_build_variant: generic
      cudnn_sdpa: false
      cuda_norm: false
      cuda_rope: false
      cuda_modulation: false
  - scenario_id: norm
    options:
      edge_cli_ref: edge_dit_cli_norm
      edge_sample_ref: edge_dit_sample_norm
      cuda_build_variant: norm
      cudnn_sdpa: false
      cuda_norm: true
      cuda_rope: false
      cuda_modulation: false
  - scenario_id: norm_rope
    options:
      edge_cli_ref: edge_dit_cli_norm_rope
      edge_sample_ref: edge_dit_sample_norm_rope
      cuda_build_variant: norm_rope
      cudnn_sdpa: false
      cuda_norm: true
      cuda_rope: true
      cuda_modulation: false
  - scenario_id: norm_rope_mod
    options:
      edge_cli_ref: edge_dit_cli_norm_rope_mod
      edge_sample_ref: edge_dit_sample_norm_rope_mod
      cuda_build_variant: norm_rope_mod
      cudnn_sdpa: false
      cuda_norm: true
      cuda_rope: true
      cuda_modulation: true
reporting:
  table: cuda_optimization_ablation
  require_quality_metrics: false
