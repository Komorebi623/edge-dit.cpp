schema_version: 1
suite_id: cache-calibration-s50
description: >
  Local FLUX.1-dev 1024x1024 50-step SenCache calibration suite. This generates
  the profile used by same-setting cache-quality diagnostics; timings are not
  comparable with normal inference timings.
mode: smoke
defaults:
  warmup_runs: 0
  measured_runs: 1
  output_encoding_in_core_latency: false
  memory_measurement: external
hardware:
  - ../hardware/h200-local.yaml
systems:
  single_gpu:
    - ../systems/edge-dit.yaml
workloads:
  single_gpu:
    - ../workloads/flux1-dev-t2i-1024-s50.yaml
ablation_stacks:
  - stack_id: sencache_calibration_s50
    options:
      cache: sencache
      cache_calibrate_ref: flux_sencache_profile_s50
reporting:
  table: cache_calibration_smoke
  generate_public_tables: false
