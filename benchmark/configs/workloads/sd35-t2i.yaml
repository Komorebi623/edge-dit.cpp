schema_version: 1
workload_id: sd35-t2i-1024
model_family: SD3
model_name: SD3.5
task: text-to-image
model:
  public_id: stabilityai/stable-diffusion-3.5-large
  local_path_ref: sd35_dir
  format: diffusers-directory
prompt_set: ../../prompts/text-to-image-v1.jsonl
prompt_id: sd35_glass_teapot
generation:
  width: 1024
  height: 1024
  frames: 1
  steps: 20
  seed: 0
  batch_size: 1
  guidance: 4.5
  cfg_scale: 1.0
  scheduler: model-default
  precision: bf16
measurement:
  output_encoding_in_core_latency: false
  require_peak_vram: true
  require_peak_host_rss: true
quality:
  enabled: true
  reference_policy: edge-dit-bf16-full-compute
  metrics: [psnr, ssim, lpips, clip, image_reward]
notes:
  - Requires a real SD3.5 Large checkpoint path in the local site config.
  - Do not point `sd35_dir` at the Stable Diffusion 3 Medium checkpoint.
