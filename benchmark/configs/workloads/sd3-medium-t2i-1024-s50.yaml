schema_version: 1
workload_id: sd3-medium-t2i-1024-s50
model_family: SD3
model_name: Stable Diffusion 3 Medium
task: text-to-image
model:
  public_id: stabilityai/stable-diffusion-3-medium
  local_path_ref: sd3_medium_dir
  format: diffusers-directory
prompt_set: ../../prompts/text-to-image-v1.jsonl
prompt_id: sd3_glass_teapot
generation:
  width: 1024
  height: 1024
  frames: 1
  steps: 50
  seed: 0
  batch_size: 1
  guidance: 4.5
  cfg_scale: 4.5
  scheduler: model-default
  precision: bf16
model_options:
  stable_diffusion_cpp_transformer_ref: sd3_medium_sdcpp_transformer
measurement:
  output_encoding_in_core_latency: false
  require_peak_vram: true
  require_peak_host_rss: true
quality:
  enabled: true
  reference_policy: edge-dit-bf16-full-compute
  metrics: [psnr, ssim, lpips, clip, image_reward]
notes:
  - README main-table workload.
  - The local checkpoint is Stable Diffusion 3 Medium, not SD3.5.
  - Keep prompt, seed, steps, resolution, guidance, and precision fixed across systems.
