schema_version: 1
system_id: xdit
display_name: xDiT
role: parallel_baseline
runner: xdit
repo:
  path_ref: xdit_repo
  remote: origin
  branch: main
  commit_policy: current_checkout
environment:
  pythonpath_ref: xdit_repo
capabilities:
  tasks: [text-to-image, text-to-video]
  backends: [cuda]
  parallel: [ulysses, ring, pipefusion, cfg]
  memory_modes: [parallel_vae, torch_dtype]
preflight:
  require_python_packages: [torch, diffusers, transformers]
  require_imports: [xfuser, distvae]
  require_flux_entrypoint: true
unsupported_policy:
  missing_flux_entrypoint_must_emit_status: unsupported
benchmark_notes:
  - xDiT is used for parallel baseline comparisons, not for the single-GPU main table.
  - Record the current xDiT checkout commit in result artifacts; do not mutate
    the external repository during benchmark execution.
  - If the latest checkout has no usable FLUX entrypoint, mark the workload unsupported with the reason.
