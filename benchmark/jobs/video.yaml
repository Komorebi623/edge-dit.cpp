# text-to-video benchmark manifest: cross-system compare (base + quant + offload + distilled)
# New schema: model lives inside each system section.
# Note: stable-diffusion.cpp does not support Wan with a single --model dir (needs component-separated loading), so its Wan runs will fail; kept for completeness.
name: video
task: text-to-video
prompts: 3
device: 2                          # lock this job to GPU 2

edge-dit:
  model: [wan2-t2v-1.3b, wan21-t2v-1.3b-distill, wan2-t2v-14b]
  quant:
    - fp16
    - {type: fp16, offload: full}
    - {type: fp16, offload: te-cpu}
    - q8
    - q4_k
diffusers:
  model: [wan2-t2v-1.3b, wan21-t2v-1.3b-distill, wan2-t2v-14b]
  quant:
    - bf16
    - {type: bf16, offload: full}
    - fp8
stable-diffusion.cpp:
  model: [wan2-t2v-1.3b, wan21-t2v-1.3b-distill, wan2-t2v-14b]
  quant:
    - fp16
    - {type: fp16, offload: full}
    - q8
