# Vulkan editing sweep: kontext + qwen-image-edit, base + distilled, edge-only.
# Editing models take an input image (input_image_ref in the model yaml).
# kontext ~ fits q8 resident; qwen-image-edit needs auto-fit (huge TE + big DiT).
name: vk-full-edit
task: image-editing
prompts: 1
device: 1
warmup: 1
measured: 1
metrics: {quality: false}

edge-dit:
  backend: vulkan
  model: [flux-kontext]
  quant:
    - q8
    - {model: kontext-lightning,          type: q8}
    - {model: qwen-image-edit,            type: q8, offload: auto-fit, max_vram: 24, vae_tiling: auto}
    - {model: qwen-image-edit-lightning,  type: q8, offload: auto-fit, max_vram: 24, vae_tiling: auto}
