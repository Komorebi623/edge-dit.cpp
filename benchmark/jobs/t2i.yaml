# text-to-image benchmark manifest: cross-system compare (base + quant + offload + distilled)
# New schema: model lives inside each system section (per-section model x quant x offload).
# single 24G budget: only baseline FP16/bf16 tiers get offload so large models can run.
# smoke test: temporarily set prompts to 1 for a quick table.
name: t2i
task: text-to-image
prompts: 3
device: 0                          # lock this job to GPU 0

edge-dit:                             # weight-only, via precision
  model: [sd3-medium, flux-dev, qwen-image, flux-schnell, sd35-medium-turbo, qwen-image-lightning]
  quant:
    - fp16
    - {type: fp16, offload: full}     # baseline A: full offload
    - {type: fp16, offload: te-cpu}   # baseline B: text encoder on CPU only (edge-only)
    - q8
    - q4_k
diffusers:                            # Optimum-Quanto, via quant_weights
  model: [sd3-medium, flux-dev, qwen-image, flux-schnell, sd35-medium-turbo, qwen-image-lightning]
  quant:
    - bf16
    - {type: bf16, offload: full}     # baseline: full offload (diffusers has no te-cpu)
    - fp8
stable-diffusion.cpp:                 # native baseline
  model: [sd3-medium, flux-dev, qwen-image, flux-schnell, sd35-medium-turbo, qwen-image-lightning]
  quant:
    - fp16
    - {type: fp16, offload: full}     # baseline: full offload (sd.cpp has no te-cpu)
    - q8
    - q4_k
