# image-editing benchmark manifest: cross-system compare (base + quant + offload + distilled)
# New schema: model lives inside each system section.
name: edit
task: image-editing
prompts: 3
device: 1                          # lock this job to GPU 1

edge-dit:
  model: [flux-kontext, kontext-lightning, qwen-image-edit, qwen-image-edit-lightning]
  quant:
    - fp16
    - {type: fp16, offload: full}
    - {type: fp16, offload: te-cpu}
    - q8
    - q4_k
diffusers:
  model: [flux-kontext, kontext-lightning, qwen-image-edit, qwen-image-edit-lightning]
  quant:
    - bf16
    - {type: bf16, offload: full}
    - fp8
stable-diffusion.cpp:
  model: [flux-kontext, kontext-lightning, qwen-image-edit, qwen-image-edit-lightning]
  quant:
    - fp16
    - {type: fp16, offload: full}
    - q8
