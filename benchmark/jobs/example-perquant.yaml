# Example 5 - per-quant object override (configure one tier individually)
# Besides an id string, a quant list item can be an object {type:, offload:, vae_tiling:, cache:};
# the offload/vae_tiling/cache in the object override the section defaults, only for that tier.
# Use: most tiers use section defaults, a few toggle something individually.
# Expanded runs: edge-dit section [ models(1) x quant(3) x prompts(3) ] = 9
#   - fp16 : section default (offload=none, cache=none)
#   - q8   : object override offload=full (full offload)
#   - q4_k : object override cache=taylorseer
name: example-perquant
task: text-to-image
models: [sd3-medium]

edge-dit:
  quant:
    - fp16                             # bare id: uses section default
    - {type: q8, offload: full}        # only this q8 tier does full offload
    - {type: q4_k, cache: taylorseer}  # only this q4_k tier adds taylorseer cache
  offload: none                        # section default (bare fp16 uses it; object-overridden tiers unaffected)
