# Example 1 - single model, three quant tiers + quality (minimal starter / the README quick-start points here)
# per-system section format: top level holds shared fields (name/task/models/prompts/steps/metrics),
# each system to test gets its own section. Here only edge-dit is tested; its section carries the quant list (required).
# Section defaults for the rest: offload=none, vae_tiling=auto, cache=none. Top-level defaults: prompts=3, all quality on.
# Expanded runs: edge-dit section [ models(1) x quant(3) x offload(1) x cache(1) x prompts(3) ] = 9
name: example-quant-sweep
task: text-to-image
models: [sd3-medium]

edge-dit:
  quant: [fp16, q8, q4_k]

# To sweep both "offload on/off" budgets across these tiers, write offload as a list (sweeps the whole section):
#   edge-dit:
#     quant:   [fp16, q8, q4_k]
#     offload: [none, full]        # each tier runs both none and full, doubling run count
